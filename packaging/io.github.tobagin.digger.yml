app-id: io.github.tobagin.digger
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: digger-vala
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - /share/vala
  - '*.la'
  - '*.a'

modules:
  # libuv dependency for BIND
  - name: libuv
    buildsystem: autotools
    sources:
      - type: archive
        url: https://dist.libuv.org/dist/v1.53.0/libuv-v1.53.0.tar.gz
        sha256: cb0d6dd2128d5a95bd242c6cc982a24fe608fa93da57b6b4ec763b0018c53e64
    config-opts:
      - --disable-static
      - --enable-shared

  # liburcu: mandatory dependency of BIND 9.20
  - name: liburcu
    buildsystem: autotools
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://lttng.org/files/urcu/userspace-rcu-0.15.7.tar.bz2
        sha256: 2556b83adc0f9b3ac8024e613e17d014d04c4c49110604ce55fcb14eae32edd3
        x-checker-data:
          type: anitya
          project-id: 5953
          url-template: https://lttng.org/files/urcu/userspace-rcu-$version.tar.bz2

  # BIND dig command; OpenSSL comes from the runtime
  - name: bind-dig
    buildsystem: autotools
    sources:
      - type: archive
        url: https://downloads.isc.org/isc/bind9/9.20.29/bind-9.20.29.tar.xz
        sha256: 587029508b3b1b43229fae416c97e5543aba45809cefaca98a5004a02a5736c1
        x-checker-data:
          type: anitya
          project-id: 1365
          url-template: https://downloads.isc.org/isc/bind9/$version/bind-$version.tar.xz
    config-opts:
      - --disable-static
      - --enable-shared
      - --disable-doh
      - --disable-dnsrps
      - --disable-dnstap
      - --disable-geoip
      - --without-gssapi
      - --without-jemalloc
      - --without-json-c
      - --without-libidn2
      - --without-libxml2
      - --without-lmdb
      - --without-readline
      - --without-zlib
    cleanup:
      - '*.la'
      - '/share/man'
      - '/lib/pkgconfig'
      - '/bin/arpaname'
      - '/bin/ddns-confgen'
      - '/bin/delv'
      - '/bin/dnssec*'
      - '/bin/dnstap-read'
      - '/bin/host'
      - '/bin/mdig'
      - '/bin/named*'
      - '/bin/nsec3hash'
      - '/bin/nslookup'
      - '/bin/nsupdate'
      - '/bin/rndc*'
      - '/bin/tsig-keygen'
      - '/sbin'

  # whois command for domain registration lookups
  - name: whois
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/rfc1036/whois/archive/refs/tags/v5.6.6.tar.gz
        sha256: 43d3b3cc64c75e8bd10aee6feff3906e9488ed335076d206e70f3b25bf644969
    build-commands:
      - make whois
      - install -Dm755 whois /app/bin/whois

  - name: digger
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/tobagin/digger.git
        tag: v2.9.0
